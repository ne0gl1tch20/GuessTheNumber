name: Desktop routing final patch
on:
  push:
    branches: [master]
    paths: ['.github/workflows/desktop-routing-final-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          p=Path('desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt')
          s=p.read_text()
          a='''                                        feedback = "Switched to save slot $targetSlot."\n                                    } else feedback ='''
          b='''                                        feedback = "Switched to save slot $targetSlot."\n                                        if (section == DesktopGameSection.SAVE_SLOTS) onNativeSaveLoaded()\n                                    } else feedback ='''
          if a not in s: raise SystemExit('switch callback anchor missing')
          s=s.replace(a,b,1)
          a='''                                feedback = "Created and switched to slot $targetSlot."\n                            } else feedback ='''
          b='''                                feedback = "Created and switched to slot $targetSlot."\n                                if (section == DesktopGameSection.SAVE_SLOTS) onNativeSaveLoaded()\n                            } else feedback ='''
          if a not in s: raise SystemExit('create callback anchor missing')
          s=s.replace(a,b,1)
          p.write_text(s)

          m=Path('desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/Main.kt')
          s=m.read_text()
          s=s.replace('''                                        DesktopDestination.MUTATORS -> DesktopGameSection.MUTATORS\n                                        DesktopDestination.SAVE_SLOTS -> DesktopGameSection.SAVE_SLOTS\n                                        DesktopDestination.RELICS -> DesktopGameSection.RELICS''','''                                        DesktopDestination.MUTATORS -> DesktopGameSection.MUTATORS\n                                        DesktopDestination.RELICS -> DesktopGameSection.RELICS''',1)
          s=s.replace('''                                        DesktopDestination.LUCKY_STAKE -> DesktopGameSection.LUCKY_STAKE\n                                        DesktopDestination.ARCADE -> DesktopGameSection.ARCADE\n                                        DesktopDestination.MUSIC_PLAYER -> DesktopGameSection.MUSIC_PLAYER''','''                                        DesktopDestination.LUCKY_STAKE -> DesktopGameSection.LUCKY_STAKE\n                                        DesktopDestination.MUSIC_PLAYER -> DesktopGameSection.MUSIC_PLAYER''',1)
          m.write_text(s)
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/Main.kt
          git commit -m 'fix(desktop): close save popup after slot activation'
          git rm .github/workflows/desktop-routing-final-patch.yml
          git commit -m 'chore: remove temporary routing patch workflow'
          git push origin master
