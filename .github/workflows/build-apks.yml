name: Android Validation and Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Validate and Test Android (no APK build)
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_luaLiveOpsPublicKeyBase64: ${{ secrets.LUA_LIVEOPS_PUBLIC_KEY_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Revision
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          echo "GitHub ref: $GITHUB_REF"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Localizations
        run: python3 tools/validate_locales.py

      - name: Validate Localization Release Gate
        run: python3 tools/validate_localization_release_gate.py

      - name: Validate Version Metadata
        run: python3 tools/validate_versions.py

      - name: Validate All JSON Assets
        run: python3 tools/validate_json_assets.py

      - name: Audit Repository Localization Surface
        run: python3 tools/audit_localization_surface.py

      - name: Audit Hardcoded UI Strings
        run: python3 tools/validate_hardcoded_strings.py

      - name: Audit every tracked HTML, CSS and JavaScript file
        run: python3 tools/audit_web_frontend.py --report-file build/reports/web-frontend-audit.txt

      - name: Fast Kotlin Preflight Check
        run: python3 tools/preflight_compile_check.py

      - name: Build Preflight
        run: python3 tools/build_preflight.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Full Gradle Check
        run: ./gradlew check

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*.html
            build/reports/web-frontend-audit.txt
          if-no-files-found: warn
