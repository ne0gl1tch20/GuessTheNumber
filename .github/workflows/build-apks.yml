name: Build Android APKs (Debug & Release)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Validate, Test, and Build Debug/Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Revision
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          echo "GitHub ref: $GITHUB_REF"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Localizations
        run: python3 tools/validate_locales.py

      - name: Validate Version Metadata
        run: python3 tools/validate_versions.py

      - name: Validate All JSON Assets
        run: python3 tools/validate_json_assets.py

      - name: Audit Repository Localization Surface
        run: python3 tools/audit_localization_surface.py

      - name: Audit Hardcoded UI Strings
        run: python3 tools/validate_hardcoded_strings.py

      - name: Fast Kotlin Preflight Check
        run: python3 tools/preflight_compile_check.py

      - name: Build Preflight
        run: python3 tools/build_preflight.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Full Gradle Check
        run: ./gradlew check

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*.html
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-release
          path: app/build/outputs/apk/release/*.apk
