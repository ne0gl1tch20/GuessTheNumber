name: Windows PR Build Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pr-build-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-tests:
    name: Validate and test Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GTN_WINDOWS_PACKAGE_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vendor pinned PixiJS browser bundle
        shell: pwsh
        run: |
          npm install --prefix tools/pixi-vendor --no-package-lock --no-audit --no-fund
          node tools/vendor_pixi.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare desktop build version resource
        shell: pwsh
        run: |
          $resourceDir = "desktopApp/src/jvmMain/resources"
          New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          Set-Content -Path (Join-Path $resourceDir "windows-build.properties") -Value "version=$env:GTN_WINDOWS_PACKAGE_VERSION" -Encoding ascii

      - name: Validate localizations
        run: python tools/validate_locales.py

      - name: Validate localization release gate
        run: python tools/validate_localization_release_gate.py

      - name: Validate version metadata
        run: python tools/validate_versions.py

      - name: Verify Android and Windows theme compatibility
        run: python tools/validate_android_windows_theme_parity.py

      - name: Validate JSON assets
        run: python tools/validate_json_assets.py

      - name: Audit repository localization surface
        run: python tools/audit_localization_surface.py

      - name: Audit hardcoded UI strings
        run: python tools/validate_hardcoded_strings.py

      - name: Audit every tracked HTML, CSS and JavaScript file
        run: python tools/audit_web_frontend.py --report-file build/reports/web-frontend-audit.txt

      - name: Fast Kotlin preflight check
        run: python tools/preflight_compile_check.py

      - name: Build preflight
        run: python tools/build_preflight.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 compiler was not installed." }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused WebView bridge contract tests
        shell: pwsh
        run: |
          python tools/test_webview_bridge_contract.py
          .\\gradlew.bat :desktopApp:jvmTest --tests com.jarrlyyy.guessthenumber.desktop.DesktopBridgePayloadTest

      - name: Run shared tests and compile Windows desktop app
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:jvmTest :desktopApp:compileKotlinJvm

      - name: Build Windows installer without uploading it
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageWindowsInnoSetup --no-configuration-cache

      - name: Verify Inno Setup installer was produced
        shell: pwsh
        run: |
          $installerDir = "desktopApp/build/compose/binaries/main/exe"
          $installer = Get-ChildItem -Path $installerDir -Filter "*-Setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "Inno Setup Windows installer was not produced." }
          Write-Host "Windows build test produced: $($installer.Name) ($($installer.Length) bytes)"
