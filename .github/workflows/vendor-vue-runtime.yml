name: Verify pinned Vue runtime

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vendor-vue-runtime.yml"
      - "tools/vendor_vue_runtime.sh"
      - "app/src/main/assets/libraries/vue/**"
  pull_request:
    paths:
      - ".github/workflows/vendor-vue-runtime.yml"
      - "tools/vendor_vue_runtime.sh"
      - "app/src/main/assets/libraries/vue/**"

permissions:
  contents: read

jobs:
  verify-vue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the pinned local runtime
        run: bash tools/vendor_vue_runtime.sh
      - name: Verify vendored runtime is reproducible
        run: git diff --exit-code -- app/src/main/assets/libraries/vue/
