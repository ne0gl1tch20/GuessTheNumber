name: Test Daily Rewards Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: test-daily-rewards-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  test-daily-rewards:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/testdailyrewards' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run daily reward and offline reward protocol tests
        id: tests
        run: ./gradlew :app:testDebugUnitTest --tests 'com.jarrlyyy.guessthenumber.ui.screens.WebUiBridgeProtocolTest' --no-configuration-cache

      - name: Report result on the pull request
        if: always() && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME || 'not run';
            const sha = process.env.HEAD_SHA || 'unknown';
            const passed = outcome === 'success';
            const body = [
              passed ? '✅ **Daily reward tests passed**' : '❌ **Daily reward tests did not pass**',
              '',
              'Command: `/testdailyrewards`',
              'Test: `WebUiBridgeProtocolTest` (daily reward claim and offline reward dismissal protocol coverage)',
              `Commit: ${sha}`,
              `Result: ${outcome}`,
              '',
              'Workflow logs: ' + `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
