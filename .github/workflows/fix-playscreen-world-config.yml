name: Fix PlayScreen world config references

on:
  push:
    branches:
      - feat/lua-runtime-engine

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix renamed world definition fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/PlayScreen.kt')
          s = p.read_text()
          updated = s.replace('world.bossNameKey', 'world.bossKey').replace('world.rewardKey', 'world.bossRewardKey')
          if updated == s:
              print('No PlayScreen world-field replacements needed.')
              raise SystemExit(0)
          p.write_text(updated)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/PlayScreen.kt
          git commit -m 'Fix PlayScreen world config field names'
          git push
