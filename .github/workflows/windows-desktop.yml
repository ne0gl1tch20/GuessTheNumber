name: Windows Desktop CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "ci/**"
    paths:
      - "app/**"
      - "desktopApp/**"
      - "shared/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/build-apks.yml"
  pull_request:
    branches:
      - master
    paths:
      - "app/**"
      - "desktopApp/**"
      - "shared/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/build-apks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Validate, test, and package Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GTN_WINDOWS_PACKAGE_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write desktop build version resource
        shell: pwsh
        run: |
          $resourceDir = "desktopApp/src/jvmMain/resources"
          New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          Set-Content -Path (Join-Path $resourceDir "windows-build.properties") -Value "version=$env:GTN_WINDOWS_PACKAGE_VERSION" -Encoding ascii

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Localizations
        shell: pwsh
        run: python tools/validate_locales.py

      - name: Validate Localization Release Gate
        shell: pwsh
        run: python tools/validate_localization_release_gate.py

      - name: Validate Version Metadata
        shell: pwsh
        run: python tools/validate_versions.py

      - name: Verify Android and Windows theme compatibility
        shell: pwsh
        run: python tools/validate_android_windows_theme_parity.py

      - name: Validate All JSON Assets
        shell: pwsh
        run: python tools/validate_json_assets.py

      - name: Audit Repository Localization Surface
        shell: pwsh
        run: python tools/audit_localization_surface.py

      - name: Audit Hardcoded UI Strings
        shell: pwsh
        run: python tools/validate_hardcoded_strings.py

      - name: Fast Kotlin Preflight Check
        shell: pwsh
        run: python tools/preflight_compile_check.py

      - name: Build Preflight
        shell: pwsh
        run: python tools/build_preflight.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared tests and compile desktop app
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:jvmTest :desktopApp:compileKotlinJvm

      - name: Inspect desktop packaging tasks
        shell: pwsh
        run: .\gradlew.bat :desktopApp:tasks --all

      - name: Build versioned Windows installer
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageDistributionForCurrentOS --no-configuration-cache

      - name: Show packaged files
        shell: pwsh
        run: |
          Get-ChildItem -Path "desktopApp/build/compose/binaries" -Recurse -File | Select-Object FullName, Length
          if (-not (Test-Path "desktopApp/build/compose/binaries/main/msi")) {
            throw "Windows MSI output directory was not created."
          }

      - name: Verify in-place MSI upgrade from legacy package
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $gradlePath = "desktopApp/build.gradle.kts"
          $resourcePath = "desktopApp/src/jvmMain/resources/windows-build.properties"
          $msiDir = "desktopApp/build/compose/binaries/main/msi"
          $originalGradle = Get-Content -Path $gradlePath -Raw
          $baselineGradle = [regex]::Replace(
            $originalGradle,
            '(?m)^[ \t]*// Preserve the UpgradeCode embedded in the existing Windows MSI\.\r?\n[ \t]*upgradeUuid = "6178B622-7859-39F2-8ED0-E0466C715DD1"\r?\n',
            ''
          )
          if ($baselineGradle -eq $originalGradle) {
            throw "Could not prepare the legacy MSI baseline configuration."
          }

          $baselineMsi = Join-Path $env:RUNNER_TEMP "GuessTheNumber-legacy-1.0.0.msi"
          try {
            Set-Content -Path $gradlePath -Value $baselineGradle -NoNewline
            Set-Content -Path $resourcePath -Value "version=1.0.0" -Encoding ascii
            $env:GTN_WINDOWS_PACKAGE_VERSION = "1.0.0"
            Remove-Item -Path (Join-Path $msiDir "*.msi") -Force -ErrorAction SilentlyContinue
            .\gradlew.bat :desktopApp:packageDistributionForCurrentOS --no-configuration-cache --rerun-tasks --no-daemon
            $legacyPackage = Get-ChildItem -Path $msiDir -Filter "GuessTheNumber-1.0.0.msi" -File | Select-Object -First 1
            if (-not $legacyPackage) { throw "Legacy baseline MSI was not produced." }
            Copy-Item $legacyPackage.FullName $baselineMsi
            $legacyInstall = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$baselineMsi`" /qn /norestart" -Wait -PassThru
            if ($legacyInstall.ExitCode -notin @(0, 3010)) {
              throw "Legacy MSI installation failed with exit code $($legacyInstall.ExitCode)."
            }
          } finally {
            Set-Content -Path $gradlePath -Value $originalGradle -NoNewline
            $env:GTN_WINDOWS_PACKAGE_VERSION = "1.0.${{ github.run_number }}"
            Set-Content -Path $resourcePath -Value "version=$env:GTN_WINDOWS_PACKAGE_VERSION" -Encoding ascii
          }

          Remove-Item -Path (Join-Path $msiDir "*.msi") -Force -ErrorAction SilentlyContinue
          .\gradlew.bat :desktopApp:packageDistributionForCurrentOS --no-configuration-cache --rerun-tasks --no-daemon
          $updatedPackage = Get-ChildItem -Path $msiDir -Filter "GuessTheNumber-$($env:GTN_WINDOWS_PACKAGE_VERSION).msi" -File | Select-Object -First 1
          if (-not $updatedPackage) { throw "Updated MSI was not produced." }
          $updatedInstall = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$($updatedPackage.FullName)`" /qn /norestart" -Wait -PassThru
          if ($updatedInstall.ExitCode -notin @(0, 3010)) {
            throw "Updated MSI installation failed with exit code $($updatedInstall.ExitCode)."
          }

          $uninstallRoots = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $installedEntries = @(
            $uninstallRoots |
              ForEach-Object { Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue } |
              Where-Object { $_.DisplayName -like "*GuessTheNumber*" }
          )
          if ($installedEntries.Count -ne 1) {
            throw "Expected exactly one GuessTheNumber installation after update, found $($installedEntries.Count)."
          }
          if ($installedEntries[0].DisplayVersion -ne $env:GTN_WINDOWS_PACKAGE_VERSION) {
            throw "Installed MSI version does not match the updated package version."
          }
          $installedProductCode = $installedEntries[0].PSChildName
          $remove = Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$installedProductCode`" /qn /norestart" -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 1605, 3010)) {
            throw "CI cleanup of the test installation failed with exit code $($remove.ExitCode)."
          }

      - name: Prepare debug channel package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "Expected Windows MSI was not found." }
          $packageDir = Join-Path $env:RUNNER_TEMP "gtn-windows-debug"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item $msi.FullName (Join-Path $packageDir "GuessTheNumber-Windows-Desktop.msi")
          $zip = Join-Path $env:RUNNER_TEMP "GuessTheNumber-Windows-Desktop.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            channel = "windows-debug"
            version = "1.0.${{ github.run_number }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            commit = "${{ github.sha }}"
            assetName = "GuessTheNumber-Windows-Desktop.zip"
            sha256 = $hash
            tag = "windows-debug-${{ github.run_number }}-${{ github.run_attempt }}"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "windows-debug-manifest.json") -Value $manifest -Encoding utf8
          "GTN_DEBUG_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GTN_DEBUG_MANIFEST=$env:RUNNER_TEMP/windows-debug-manifest.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Windows-Desktop
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Debug update artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Windows-Debug
          path: |
            ${{ env.GTN_DEBUG_ZIP }}
            ${{ env.GTN_DEBUG_MANIFEST }}
          if-no-files-found: error
          retention-days: 14
