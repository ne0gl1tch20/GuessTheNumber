name: Windows Desktop CI

on:
  push:
    branches:
      - master
    paths:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build and publish to debug-latest"
        required: true
        default: master
        type: string
permissions:
  contents: write
  packages: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Validate, test, and package Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GTN_WINDOWS_PACKAGE_VERSION: 1.0.${{ github.run_number }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out source commit
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          if (-not $sourceCommit) { throw "Could not resolve the checked-out source commit." }
          "GTN_SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write desktop build version resource
        shell: pwsh
        run: |
          $resourceDir = "desktopApp/src/jvmMain/resources"
          New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          Set-Content -Path (Join-Path $resourceDir "windows-build.properties") -Value "version=$env:GTN_WINDOWS_PACKAGE_VERSION" -Encoding ascii

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Localizations
        shell: pwsh
        run: python tools/validate_locales.py

      - name: Validate Localization Release Gate
        shell: pwsh
        run: python tools/validate_localization_release_gate.py

      - name: Validate Version Metadata
        shell: pwsh
        run: python tools/validate_versions.py

      - name: Verify Android and Windows theme compatibility
        shell: pwsh
        run: python tools/validate_android_windows_theme_parity.py

      - name: Validate All JSON Assets
        shell: pwsh
        run: python tools/validate_json_assets.py

      - name: Audit Repository Localization Surface
        shell: pwsh
        run: python tools/audit_localization_surface.py

      - name: Audit Hardcoded UI Strings
        shell: pwsh
        run: python tools/validate_hardcoded_strings.py

      - name: Audit every tracked HTML, CSS and JavaScript file
        shell: pwsh
        run: python tools/audit_web_frontend.py --report-file build/reports/web-frontend-audit.txt

      - name: Fast Kotlin Preflight Check
        shell: pwsh
        run: python tools/preflight_compile_check.py

      - name: Audit KMP source-set boundaries
        shell: pwsh
        run: python tools/audit_kmp_source_boundaries.py

      - name: Build Preflight
        shell: pwsh
        run: python tools/build_preflight.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 compiler was not installed." }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused WebView bridge contract tests
        shell: pwsh
        run: |
          python tools/test_webview_bridge_contract.py
          .\\gradlew.bat :desktopApp:jvmTest --tests com.jarrlyyy.guessthenumber.desktop.DesktopBridgePayloadTest

      - name: Run shared tests and compile desktop app
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:jvmTest :desktopApp:compileKotlinJvm

      - name: Inspect desktop packaging tasks
        shell: pwsh
        run: .\gradlew.bat :desktopApp:tasks --all

      - name: Build versioned Windows installer
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageDistributionForCurrentOS --no-configuration-cache -P "gtn.desktop.debugToolsBuild=true"

      - name: Show packaged files
        shell: pwsh
        run: |
          Get-ChildItem -Path "desktopApp/build/compose/binaries" -Recurse -File | Select-Object FullName, Length
          if (-not (Test-Path "desktopApp/build/compose/binaries/main/exe")) {
            throw "Inno Setup output directory was not created."
          }

      - name: Verify Inno Setup install, upgrade, and data preservation
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $installerDir = "desktopApp/build/compose/binaries/main/exe"
          $installer = Get-ChildItem -Path $installerDir -Filter "*-Setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "The Inno Setup installer was not produced." }

          $userDataRoot = Join-Path (Join-Path $env:APPDATA "GuessTheNumber") "saves"
          New-Item -ItemType Directory -Path $userDataRoot -Force | Out-Null
          $userDataMarker = Join-Path $userDataRoot "ci-user-data-preservation.txt"
          Set-Content -Path $userDataMarker -Value "preserve-this-data" -Encoding ascii

          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-")
          $firstInstall = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($firstInstall.ExitCode -ne 0) { throw "Inno Setup fresh install failed with exit code $($firstInstall.ExitCode)." }
          if (-not (Test-Path $userDataMarker)) { throw "Fresh installation removed existing player data." }

          $secondInstall = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($secondInstall.ExitCode -ne 0) { throw "Inno Setup in-place upgrade failed with exit code $($secondInstall.ExitCode)." }
          if (-not (Test-Path $userDataMarker)) { throw "In-place upgrade removed existing player data." }

          $uninstaller = Join-Path $env:ProgramFiles "GuessTheNumber\unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Inno Setup uninstaller was not registered in Program Files." }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Inno Setup uninstall failed with exit code $($remove.ExitCode)." }
          if (-not (Test-Path $userDataMarker)) { throw "Inno Setup uninstall removed player data from APPDATA." }

      - name: Prepare debug channel package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/exe" -Filter "*-Setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Expected Inno Setup installer was not found." }
          $packageDir = Join-Path $env:RUNNER_TEMP "gtn-windows-debug"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item $installer.FullName (Join-Path $packageDir "GuessTheNumber-Windows-Desktop-Setup.exe")
          $zip = Join-Path $env:RUNNER_TEMP "GuessTheNumber-Windows-Desktop.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            channel = "windows-debug"
            version = "1.0.${{ github.run_number }}"
            runNumber = "${{ github.run_number }}"
            runAttempt = "${{ github.run_attempt }}"
            commit = "$env:GTN_SOURCE_COMMIT"
            assetName = "GuessTheNumber-Windows-Desktop.zip"
            sha256 = $hash
            tag = "windows-debug-${{ github.run_number }}-${{ github.run_attempt }}"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "windows-debug-manifest.json") -Value $manifest -Encoding utf8
          "GTN_DEBUG_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GTN_DEBUG_MANIFEST=$env:RUNNER_TEMP/windows-debug-manifest.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload frontend audit report
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Web-Frontend-Audit
          path: build/reports/web-frontend-audit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Windows-Desktop
          path: desktopApp/build/compose/binaries/main/exe/*-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Debug update artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Windows-Debug
          path: |
            ${{ env.GTN_DEBUG_ZIP }}
            ${{ env.GTN_DEBUG_MANIFEST }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows Debug assets to debug-latest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view debug-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create debug-latest --target "$env:GITHUB_SHA" --title "GuessTheNumber Debug Latest" --notes "Stable Debug metadata is maintained by the Stable Debug APK workflow."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the debug-latest release." }
          }
          gh release upload debug-latest "$env:GTN_DEBUG_ZIP" "$env:GTN_DEBUG_MANIFEST" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Windows Debug assets to debug-latest." }
