name: Windows Desktop CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "ci/**"
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches:
      - master
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Compile and package Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared tests and compile desktop app
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:compileKotlinJvm

      - name: Build Windows MSI installer
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
