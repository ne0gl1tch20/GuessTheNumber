name: Deploy showcase website

on:
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify required website files
        run: |
          test -s website/index.html
          test -s website/downloads.html
          test -s website/assets/site.css
          test -s website/jarrlyyuisdk/demo.html
          test -s website/jarrlyyuisdk/components/jarrlyy-ui.js
          test -s website/jarrlyyuisdk/components/jarrlyy-ui-advanced.js
          test -s website/jarrlyyuisdk/components/jarrlyy-ui-host.js
          test -s website/jarrlyyuisdk/motion-demo.js
          test -s website/jarrlyyuisdk/styles/jarrlyy-ui.css
          test -s website/jarrlyyuisdk/styles/jarrlyy-ui-advanced.css
          test -s website/jarrlyyuisdk/icons/jarrlyy-icons.svg
          grep -q 'id="main"' website/index.html
          grep -q 'id="android-list"' website/downloads.html
          grep -q 'id="windows-list"' website/downloads.html
      - name: Validate website HTML, SVG icons and inline JavaScript
        run: python3 website/tests/test_site.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
