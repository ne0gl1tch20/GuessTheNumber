name: Validate Game Data Archive

on:
  push:
    branches: [master]
    paths:
      - "app/src/main/assets/**"
      - "tools/binarify_game_data.py"
      - "tools/test_binarify_game_data.py"
      - "tools/validate_game_data_apk.py"
      - "tools/requirements-game-data.txt"
      - ".github/workflows/game-data-archive.yml"
  pull_request:
    paths:
      - "app/src/main/assets/**"
      - "tools/binarify_game_data.py"
      - "tools/test_binarify_game_data.py"
      - "tools/validate_game_data_apk.py"
      - "tools/requirements-game-data.txt"
      - ".github/workflows/game-data-archive.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive builder dependency
        run: python -m pip install -r tools/requirements-game-data.txt
      - name: Test archive builder
        run: python -m unittest discover -s tools -p 'test_binarify_game_data.py' -v
      - name: Build and verify repository game-data chunks
        run: |
          python tools/binarify_game_data.py --output "$RUNNER_TEMP/game_data"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "game_data"
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["archiveFormatVersion"] == 1
          assert manifest["minAppVersionCode"] == 24
          assert manifest["sourceCommitTimestamp"] >= 0
          assert manifest["chunks"] and manifest["files"]
          assets = pathlib.Path("app/src/main/assets")
          expected = {p.relative_to(assets).as_posix() for p in assets.rglob("*") if p.is_file()}
          expected.add("web-play/gtn-app-logo.png")
          actual_list = [entry["path"] for entry in manifest["files"]]
          assert len(actual_list) == len(set(actual_list)), "Duplicate manifest file paths"
          assert set(actual_list) == expected, f"Asset coverage mismatch: missing={expected-set(actual_list)}, extra={set(actual_list)-expected}"
          for chunk in manifest["chunks"]:
              data = (root / chunk["file"]).read_bytes()
              assert hashlib.sha256(data).hexdigest() == chunk["sha256"]
              assert data[:8] == b"GTNGBIN1"
          print(f"Verified {len(manifest['chunks'])} chunks / {len(manifest['files'])} files")
          PY

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive builder dependency
        run: python -m pip install -r tools/requirements-game-data.txt
      - name: Generate publishable game-data chunks
        run: python tools/binarify_game_data.py --output game_data
      - name: Publish chunks and manifest to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            python tools/binarify_game_data.py --output game_data --extra-file "$GITHUB_WORKSPACE/GTN_APP_LOGO.png=web-play/gtn-app-logo.png"
            git add game_data
            if [ -z "$(git status --porcelain -- game_data)" ]; then
              echo "Published game-data archive is already current"
              exit 0
            fi
            git commit -m "chore: publish encrypted game data chunks [skip ci]"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "master moved during publication (attempt $attempt); retrying"
          done
          echo "Could not publish game-data archive after 5 attempts."
          exit 1
