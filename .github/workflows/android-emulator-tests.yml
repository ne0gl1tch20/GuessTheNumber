name: Android Emulator Crash Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/src/test/**"
      - "app/src/main/assets/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-emulator-tests.yml"

jobs:
  emulator:
    name: Real Device UI Crash Brute Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            ./gradlew connectedDebugAndroidTest --stacktrace
          shutdown: false

      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-android-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/logs/**
          if-no-files-found: warn
