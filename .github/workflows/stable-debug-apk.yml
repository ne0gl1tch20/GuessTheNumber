name: Stable Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_luaLiveOpsPublicKeyBase64: ${{ secrets.LUA_LIVEOPS_PUBLIC_KEY_BASE64 }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Launcher Logo
        run: |
          test -s GTN_APP_LOGO.png
          grep -q 'rename { "gtn_app_logo.png" }' app/build.gradle.kts
          grep -q '@drawable/gtn_app_logo' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q '@drawable/gtn_app_logo' app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
      - name: Validate Localizations
        run: python3 tools/validate_locales.py
      - name: Validate Version Metadata
        run: python3 tools/validate_versions.py
      - name: Validate All JSON Assets
        run: python3 tools/validate_json_assets.py
      - name: Audit Repository Localization Surface
        run: python3 tools/audit_localization_surface.py
      - name: Audit Hardcoded UI Strings
        run: python3 tools/validate_hardcoded_strings.py
      - name: Audit every tracked HTML, CSS and JavaScript file
        run: python3 tools/audit_web_frontend.py --report-file build/reports/web-frontend-audit.txt
      - name: Fast Kotlin Preflight Check
        run: python3 tools/preflight_compile_check.py
      - name: Build Preflight
        run: python3 tools/build_preflight.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Run Full Gradle Check
        run: ./gradlew check --no-daemon
      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.GTN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing GTN_DEBUG_KEYSTORE_BASE64 repository secret.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/gtn-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gtn-signing/debug.keystore"
          chmod 600 "$RUNNER_TEMP/gtn-signing/debug.keystore"
      - name: Build signed debug APK
        env:
          GTN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/gtn-signing/debug.keystore
        run: ./gradlew assembleDebug --no-daemon
      - name: Validate embedded APK build metadata
        run: |
          version_name="$(grep -E '^[[:space:]]*val appVersionName = ' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= *"//; s/"$//')"
          version_code="$(grep -E '^[[:space:]]*val appVersionCode = ' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= *//')"
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          python3 tools/validate_apk_info.py "$apk" --env debug --commit "$GITHUB_SHA" --version-name "$version_name" --version-code "$version_code"
      - name: Create installable debug archive
        run: |
          mkdir -p "$RUNNER_TEMP/gtn-debug"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/gtn-debug/GuessTheNumber-debug.apk"
          cd "$RUNNER_TEMP/gtn-debug"
          sha256sum GuessTheNumber-debug.apk > SHA256SUMS
          version_code="$(grep -E '^[[:space:]]*versionCode = ' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= *//')"
          version_name="$(grep -E '^[[:space:]]*versionName = "' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= "//; s/"$//')"
          test -n "$version_code" && test -n "$version_name"
          printf '{"packageName":"com.jarrlyyy.guessthenumber.debug","versionName":"%s","versionCode":%s,"commit":"%s"}\n' "$version_name" "$version_code" "$GITHUB_SHA" > update-manifest.json
          zip -q "$GITHUB_WORKSPACE/GuessTheNumber-debug.zip" GuessTheNumber-debug.apk SHA256SUMS update-manifest.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload installable debug archive
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug.zip
          path: GuessTheNumber-debug.zip
          if-no-files-found: error
      - name: Upload frontend audit report
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-Web-Frontend-Audit-${{ github.run_number }}
          path: build/reports/web-frontend-audit.txt
          if-no-files-found: error

      - name: Upload stable update artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug
          path: |
            ${{ runner.temp }}/gtn-debug/GuessTheNumber-debug.apk
            ${{ runner.temp }}/gtn-debug/SHA256SUMS
            ${{ runner.temp }}/gtn-debug/update-manifest.json
          if-no-files-found: error
      - name: Publish debug-latest release asset
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_code="$(grep -E '^[[:space:]]*versionCode = ' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= *//')"
          version_name="$(grep -E '^[[:space:]]*versionName = "' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1 | sed 's/.*= "//; s/"$//')"
          release_notes="$(printf 'Stable Debug #%s\n\nVersion: %s (%s)\nCommit: %s\n\n- Refresh the installable Stable Debug APK.\n- Keep the signed ZIP and checksum metadata together.' "$GITHUB_RUN_NUMBER" "$version_name" "$version_code" "$GITHUB_SHA")"
          gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest --target "$GITHUB_SHA" --title "GuessTheNumber Debug Latest" --notes "$release_notes"
          gh release edit debug-latest --target "$GITHUB_SHA" --title "GuessTheNumber Debug Latest" --notes "$release_notes"
          gh release upload debug-latest GuessTheNumber-debug.zip --clobber
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/gtn-signing" "$RUNNER_TEMP/gtn-debug"
