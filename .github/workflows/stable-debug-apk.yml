name: Stable Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.GTN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing GTN_DEBUG_KEYSTORE_BASE64 repository secret.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/gtn-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gtn-signing/debug.keystore"
          chmod 600 "$RUNNER_TEMP/gtn-signing/debug.keystore"

      - name: Build signed debug APK
        env:
          GTN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/gtn-signing/debug.keystore
          GTN_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.GTN_DEBUG_KEYSTORE_PASSWORD }}
          GTN_DEBUG_KEY_ALIAS: ${{ secrets.GTN_DEBUG_KEY_ALIAS }}
          GTN_DEBUG_KEY_PASSWORD: ${{ secrets.GTN_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/gtn-signing"
