name: Stable Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_luaLiveOpsPublicKeyBase64: ${{ secrets.LUA_LIVEOPS_PUBLIC_KEY_BASE64 }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Localizations
        run: python3 tools/validate_locales.py

      - name: Validate Version Metadata
        run: python3 tools/validate_versions.py

      - name: Validate All JSON Assets
        run: python3 tools/validate_json_assets.py

      - name: Audit Repository Localization Surface
        run: python3 tools/audit_localization_surface.py

      - name: Audit Hardcoded UI Strings
        run: python3 tools/validate_hardcoded_strings.py

      - name: Fast Kotlin Preflight Check
        run: python3 tools/preflight_compile_check.py

      - name: Build Preflight
        run: python3 tools/build_preflight.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Full Gradle Check
        run: ./gradlew check --no-daemon

      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.GTN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing GTN_DEBUG_KEYSTORE_BASE64 repository secret.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/gtn-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gtn-signing/debug.keystore"
          chmod 600 "$RUNNER_TEMP/gtn-signing/debug.keystore"

      - name: Build signed debug APK
        env:
          GTN_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/gtn-signing/debug.keystore
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheNumber-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/gtn-signing"
