name: Apply HTML feature update

on:
  push:
    branches:
      - feature/html-economy-tutorial-reset

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested web UI features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json
          root=Path('.')
          def replace_once(path, old, new):
              p=root/path; s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing pattern in {path}: {old[:180]}')
              p.write_text(s.replace(old,new,1))
          def add_once(path, marker, addition):
              p=root/path; s=p.read_text()
              if addition.strip() in s: return
              if marker not in s: raise SystemExit(f'Missing marker in {path}: {marker[:180]}')
              p.write_text(s.replace(marker, marker+addition,1))

          # HTML: daily rewards page, closeable popup, balances, reset dialog.
          p=root/'app/src/main/assets/web-play/index.html'; s=p.read_text()
          rewards_marker='<div class="screen" id="screen-rewards" role="tabpanel" aria-labelledby="tab-rewards" data-screen="rewards" hidden>\n'
          rewards_card='''<section class="daily-rewards-page card" aria-label="Daily Nebula rewards">\n      <div class="panel-title"><span class="panel-glyph milestone-glyph"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-gift"></use></svg></span><div><span class="eyebrow">DAILY LOGIN</span><h2 data-i18n="daily_reward_title">Daily Nebula Reward</h2></div><span class="panel-chip" id="dailyRewardPageStatus">READY</span></div>\n      <p id="dailyRewardPageSubtitle" data-i18n="daily_reward_subtitle">Claim today's reward and keep your streak alive.</p>\n      <div class="daily-reward-page-main"><strong class="reward-amount" id="dailyRewardPageAmount">+5 Nebula</strong><p class="reward-streak" id="dailyRewardPageStreak">Day 1 streak</p></div>\n      <div id="dailyRewardPageSchedule" class="daily-reward-schedule" aria-label="Upcoming daily rewards"></div>\n      <p id="dailyRewardPageMessage" class="catalog-intro" role="status" aria-live="polite"></p>\n      <button type="button" class="primary-action reward-claim" id="dailyRewardPageClaim">Claim reward</button>\n    </section>\n'''
          if 'id="dailyRewardPageClaim"' not in s: s=s.replace(rewards_marker,rewards_marker+rewards_card,1)
          popup='<button type="button" class="primary-action reward-claim" id="dailyRewardClaim">Claim reward</button>'
          if 'id="dailyRewardClose"' not in s: s=s.replace(popup,popup+'\n      <button type="button" class="secondary-action reward-close" id="dailyRewardClose">Close</button>',1)
          for marker,id_,label,indent in [
              ('id="upgradeList"','upgradeCurrencyBalance','Nebula','      '),
              ('id="shopList"','shopCurrencyBalance','Nebula','      '),
              ('id="prestigeUpgradeList"','prestigeUpgradeCurrencyBalance','Prestige','        '),
              ('id="prestigeShopList"','prestigeShopCurrencyBalance','Prestige','        '),
              ('id="ultraUpgradeList"','ultraUpgradeCurrencyBalance','Ultra','        '),
              ('id="ultraShopList"','ultraShopCurrencyBalance','Ultra','        '),
          ]:
              if id_ not in s and marker in s:
                  s=s.replace(marker,f'<div class="catalog-currency-balance" id="{id_}" aria-live="polite">{label}: <strong>0</strong></div>\n{indent}<div {marker}',1)
          if 'id="resetEverythingButton"' not in s:
              marker='<button type="button" id="rerunNimmyButton"'
              pos=s.find(marker)
              if pos<0: raise SystemExit('Settings Nimmy button not found')
              end=s.find('</button>',pos)
              if end<0: raise SystemExit('Settings Nimmy button close not found')
              end+=len('</button>')
              reset='''\n      <section class="settings-danger card" aria-labelledby="resetEverythingTitle">\n        <div class="panel-title"><span class="panel-glyph"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-refresh"></use></svg></span><div><span class="eyebrow">DATA</span><h3 id="resetEverythingTitle" data-i18n="reset_everything_label">Reset Everything</h3></div></div>\n        <p data-i18n="reset_data_warning">Are you sure you want to reset all progress? This action is irreversible.</p>\n        <button type="button" class="world-action-button" id="resetEverythingButton" data-bridge-action="reset_everything" data-i18n="reset_everything_label">Reset Everything</button>\n      </section>'''
              s=s[:end]+reset+s[end:]
          if 'id="resetEverythingDialog"' not in s:
              marker='<section id="nimmyTutorial"'
              dialog='''<section id="resetEverythingDialog" class="nimmy-tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="resetEverythingDialogTitle">\n    <div class="nimmy-tutorial-backdrop" aria-hidden="true"></div>\n    <div class="nimmy-dialog card reset-dialog">\n      <span class="eyebrow">DATA RESET</span>\n      <h2 id="resetEverythingDialogTitle" data-i18n="confirm_data_reset_title">Confirm Data Reset</h2>\n      <p id="resetEverythingWarning" data-i18n="reset_data_warning">Are you sure you want to reset all progress? This action is irreversible.</p>\n      <p id="resetMathPrompt" class="reset-math-prompt"></p>\n      <p id="resetTimerText" class="catalog-intro">Wait 45s before confirming.</p>\n      <label class="reset-check-row"><input type="checkbox" id="resetAcknowledgement"><span data-i18n="reset_data_acknowledgement">I understand this will erase all my progress</span></label>\n      <input id="resetMathAnswer" class="stake-input" inputmode="numeric" autocomplete="off" aria-label="Reset verification answer">\n      <div class="nimmy-actions"><button type="button" class="secondary-action" id="resetCancelButton">Cancel</button><button type="button" class="primary-action" id="resetConfirmButton" disabled>Confirm reset</button></div>\n    </div>\n  </section>\n  '''
              s=s.replace(marker,dialog+marker,1)
          p.write_text(s)

          # JS: custom profile image, balances, daily rewards page, close button, feature tutorials, reset challenge.
          p=root/'app/src/main/assets/web-play/app.js'; s=p.read_text()
          old="if(avatar){const icons={star:'⭐',cat:'🐱',fox:'🦊',dog:'🐶',robot:'🤖',ghost:'👻',dragon:'🐉',alien:'👽',rocket:'🚀',crown:'👑',gem:'💎',controller:'🎮',moon:'🌙',sun:'☀️',flower:'🌸',lightning:'⚡'};avatar.textContent=icons[m.avatarId]||'⭐'}return"
          new="if(avatar){const icons={star:'⭐',cat:'🐱',fox:'🦊',dog:'🐶',robot:'🤖',ghost:'👻',dragon:'🐉',alien:'👽',rocket:'🚀',crown:'👑',gem:'💎',controller:'🎮',moon:'🌙',sun:'☀️',flower:'🌸',lightning:'⚡'};avatar.replaceChildren();if(m.avatarId==='custom'&&typeof m.customAvatarData==='string'&&m.customAvatarData.startsWith('data:image/')){const image=document.createElement('img');image.src=m.customAvatarData;image.alt='';image.className='player-profile-custom-avatar';avatar.appendChild(image)}else avatar.textContent=icons[m.avatarId]||'⭐'}return"
          replace_once('app/src/main/assets/web-play/app.js',old,new)
          if 'prestigeUpgradeCurrencyBalance' not in s:
              needle="renderCurrencyCatalog('ultraShopList',s.ultraShopItems,'ultra_shop','Ultra');"
              addition="\n const balance=(id,label,value)=>{const node=$(id);if(node)node.innerHTML=label+': <strong>'+String(value??0)+'</strong>';};\n balance('upgradeCurrencyBalance','Nebula',s.nebula);balance('shopCurrencyBalance','Nebula',s.nebula);balance('prestigeUpgradeCurrencyBalance','Prestige',s.prestige);balance('prestigeShopCurrencyBalance','Prestige',s.prestige);balance('ultraUpgradeCurrencyBalance','Ultra',s.ultra);balance('ultraShopCurrencyBalance','Ultra',s.ultra);"
              replace_once('app/src/main/assets/web-play/app.js',needle,needle+addition)
          if 'function renderDailyRewardPage' not in s:
              helper="""\nfunction renderDailyRewardPage(s){\n const available=!!s.dailyRewardAvailable;\n setText($('dailyRewardPageAmount'),'+ '+String(s.dailyRewardAmount??'5')+' Nebula');\n const nextDay=Number(s.dailyRewardNextStreak??(Number(s.dailyRewardStreak||0)>=7?1:Number(s.dailyRewardStreak||0)+1));\n setText($('dailyRewardPageStreak'),uiText('daily_reward_streak','Day %s streak').replace(/%s/g,String(nextDay)));\n const status=$('dailyRewardPageStatus'),message=$('dailyRewardPageMessage'),button=$('dailyRewardPageClaim');\n if(status)status.textContent=available?'READY':'CLAIMED';\n if(message)message.textContent=available?uiText('daily_reward_subtitle','Claim today\\'s reward and keep your streak alive.'):uiText('daily_reward_claimed','Today\\'s reward is already claimed. Come back tomorrow to claim again.');\n if(button){button.disabled=!!pending||!available;button.textContent=available?uiText('daily_reward_claim','Claim reward'):uiText('daily_reward_claimed','Come back tomorrow');}\n const schedule=$('dailyRewardPageSchedule');if(schedule){schedule.replaceChildren();[5,10,15,20,25,30,50].forEach((amount,index)=>{const card=document.createElement('div');card.className='daily-reward-day'+(index===6?' daily-reward-day-gift':'');const label=document.createElement('span');label.textContent=uiText('daily_reward_streak','Day %s streak').replace(/%s/g,String(index+1));const reward=document.createElement('strong');reward.textContent=(index===6?'🎁 ':'+')+amount+' Nebula';card.append(label,reward);schedule.appendChild(card)})}\n}\n"""
              replace_once('app/src/main/assets/web-play/app.js','function renderRewardPopups(s){',helper+'function renderRewardPopups(s){')
          if 'renderDailyRewardPage(s);' not in s: replace_once('app/src/main/assets/web-play/app.js','renderRewardPopups(s);maybeStartNimmyTutorial();','renderRewardPopups(s);renderDailyRewardPage(s);maybeStartNimmyTutorial();')
          oldclick="$('dailyRewardClaim')?.addEventListener('click',()=>{dailyRewardTestOverride=false;send('claim_daily_reward')});"
          if 'dailyRewardClose' not in s: replace_once('app/src/main/assets/web-play/app.js',oldclick,oldclick+"$('dailyRewardClose')?.addEventListener('click',()=>{$('dailyRewardOverlay')&&( $('dailyRewardOverlay').hidden=true)});$('dailyRewardPageClaim')?.addEventListener('click',()=>{if(lastState?.dailyRewardAvailable)send('claim_daily_reward')});")
          feature_marker='let nimmyShouldShowTutorial=false,nimmyTutorialStarted=false,nimmyStepIndex=0,nimmyTarget=null,nimmyCompletionNeedsSave=false;'
          if 'let nimmyFeatureId' not in s:
              feature="""\nlet nimmyFeatureId=null,nimmyFeatureSteps=[];\nconst featureTutorialTargets={rewards:['#dailyRewardPageClaim','#screen-rewards .milestone-row'],journey:['#screen-journey .journey-card','#screen-journey'],shop:['#shopCurrencyBalance','#shopList'],homebase:['#upgradeHomeBase','#homeBaseLevelPanel'],relics:['#relicList','#relicCount'],codex:['#codexList','#claimCodexReward'],settings:['#rerunNimmyButton','#resetEverythingButton'],prestige:['#prestigeUpgradeList','#prestigeShopList'],ultra:['#ultraUpgradeList','#ultraShopList'],talent:['#talentList','#talentCount'],mutators:['#mutatorList','#mutatorCount'],stats:['#screen-stats','#screen-stats'],arcade:['#arcadeList','#screen-arcade'],stake:['#stakeFlip','#stakeAmount'],music:['#musicPlayPause','#musicLibrary'],changelog:['#changelogContent','#screen-changelog'],about:['#aboutCheckUpdates','#screen-about']};\nfunction startFeatureTutorial(feature){if(!feature||feature==='play'||nimmyFeatureId||!lastState)return;const targets=(featureTutorialTargets[feature]||[]).filter(sel=>document.querySelector(sel));if(!targets.length)return;nimmyFeatureId=feature;nimmyFeatureSteps=targets.map((target,index)=>({target,title:index?'nimmy_step_upgrades_title':'nimmy_step_more_title',titleFallback:index?'Here’s the useful part.':'Let’s explore this page!',body:index?'nimmy_step_upgrades_body':'nimmy_step_more_body',bodyFallback:'Nimmy will show you what this page is for.'}));nimmyStepIndex=0;nimmyTutorialStarted=true;$('nimmyTutorial').hidden=false;renderFeatureNimmyStep()}\nfunction renderFeatureNimmyStep(){const step=nimmyFeatureSteps[nimmyStepIndex];if(!step)return;setText($('nimmyName'),uiText('nimmy_name','Nimmy'));setText($('nimmyStep'),uiText('nimmy_step_counter','Step %s of %s').replace('%s',String(nimmyStepIndex+1)).replace('%s',String(nimmyFeatureSteps.length)));setText($('nimmyTitle'),uiText(step.title,step.titleFallback));setText($('nimmyBody'),uiText(step.body,step.bodyFallback));setText($('nimmyNext'),nimmyStepIndex===nimmyFeatureSteps.length-1?uiText('nimmy_finish','Let’s go!'):uiText('nimmy_next','Next'));updateNimmySpotlight()}\nfunction finishFeatureTutorial(){const feature=nimmyFeatureId;if(nimmyTarget)nimmyTarget.classList.remove('nimmy-target-highlight');nimmyTarget=null;nimmyFeatureId=null;nimmyFeatureSteps=[];nimmyTutorialStarted=false;$('nimmyTutorial').hidden=true;if(feature&&host)send('complete_feature_tutorial',{featureId:feature})}\n"""
              replace_once('app/src/main/assets/web-play/app.js',feature_marker,feature_marker+feature)
          s=p.read_text()
          s=s.replace('const step=nimmySteps[nimmyStepIndex],target=step&&document.querySelector(step.target)', 'const step=(nimmyFeatureId?nimmyFeatureSteps:nimmySteps)[nimmyStepIndex],target=step&&document.querySelector(step.target)',1)
          oldnext="$('nimmyNext')?.addEventListener('click',()=>{if(!nimmyTutorialStarted)return;if(nimmyStepIndex>=nimmySteps.length-1){finishNimmyTutorial();return}nimmyStepIndex++;renderNimmyStep()});"
          newnext="$('nimmyNext')?.addEventListener('click',()=>{if(!nimmyTutorialStarted)return;const steps=nimmyFeatureId?nimmyFeatureSteps:nimmySteps;if(nimmyStepIndex>=steps.length-1){if(nimmyFeatureId)finishFeatureTutorial();else finishNimmyTutorial();return}nimmyStepIndex++;if(nimmyFeatureId)renderFeatureNimmyStep();else renderNimmyStep()});"
          replace_once('app/src/main/assets/web-play/app.js',oldnext,newnext)
          replace_once('app/src/main/assets/web-play/app.js',"$('nimmySkip')?.addEventListener('click',finishNimmyTutorial);","$('nimmySkip')?.addEventListener('click',()=>nimmyFeatureId?finishFeatureTutorial():finishNimmyTutorial);")
          oldact="if(el.actionStatus)el.actionStatus.textContent='Opened '+labels[next]+'.';if(next==='more')"
          newact="if(el.actionStatus)el.actionStatus.textContent='Opened '+labels[next]+'.';if(next!=='more'&&next!=='play'&&next!=='worlds')window.setTimeout(()=>{if(host&&!pending){nimmyFeatureId=next;send('read_feature_tutorial',{featureId:next})}},120);if(next==='more')"
          replace_once('app/src/main/assets/web-play/app.js',oldact,newact)
          receive_marker="if(m.type==='onboarding_state'){suppressDailyRewardThisSession=!m.dailyRewardFirstLaunchSeen;nimmyShouldShowTutorial=!m.nimmyTutorialCompleted;send('read_state');return}"
          replace_once('app/src/main/assets/web-play/app.js',receive_marker,receive_marker+"if(m.type==='feature_tutorial_state'){const feature=String(m.featureId||nimmyFeatureId||'');if(!m.completed)startFeatureTutorial(feature);else nimmyFeatureId=null;return}")
          # reset challenge
          if 'function openResetDialog' not in s:
              reset="""\nlet resetChallenge=null,resetReadyAt=0,resetTimer=null;\nfunction randomResetChallenge(){const ops=['+','-','*','/'],terms=2+Math.floor(Math.random()*2),nums=Array.from({length:terms},()=>10+Math.floor(Math.random()*90));let value=nums[0],expression=String(nums[0]);for(let i=1;i<terms;i++){const op=ops[Math.floor(Math.random()*ops.length)];let n=nums[i];if(op==='/'){n=1+Math.floor(Math.random()*9);value=Math.trunc(value/n)}else if(op==='+')value+=n;else if(op==='-')value-=n;else value*=n;expression+=' '+op+' '+n}return {expression,value}}\nfunction openResetDialog(){const root=$('resetEverythingDialog');if(!root)return;resetChallenge=randomResetChallenge();resetReadyAt=Date.now()+45000;root.hidden=false;$('resetMathAnswer').value='';$('resetAcknowledgement').checked=false;$('resetConfirmButton').disabled=true;setText($('resetMathPrompt'),resetChallenge.expression+' = ?');const tick=()=>{const left=Math.max(0,resetReadyAt-Date.now());setText($('resetTimerText'),left>0?'Wait '+Math.ceil(left/1000)+'s before confirming.':'You may confirm the reset.');const valid=left<=0&&$('resetAcknowledgement').checked&&Number($('resetMathAnswer').value)===resetChallenge.value;$('resetConfirmButton').disabled=!valid;if(left<=0){clearInterval(resetTimer);resetTimer=null}};clearInterval(resetTimer);resetTimer=setInterval(tick,250);tick();$('resetMathAnswer').focus()}\nfunction closeResetDialog(){if($('resetEverythingDialog'))$('resetEverythingDialog').hidden=true;clearInterval(resetTimer);resetTimer=null}\n"""
              replace_once('app/src/main/assets/web-play/app.js','let changelogLoadPromise=null;',reset+'let changelogLoadPromise=null;')
          reset_handlers="$('resetEverythingButton')?.addEventListener('click',openResetDialog);$('resetCancelButton')?.addEventListener('click',closeResetDialog);$('resetAcknowledgement')?.addEventListener('change',()=>document.getElementById('resetMathAnswer')?.dispatchEvent(new Event('input')));$('resetMathAnswer')?.addEventListener('input',()=>{const left=Math.max(0,resetReadyAt-Date.now()),valid=left<=0&&$('resetAcknowledgement').checked&&Number($('resetMathAnswer').value)===resetChallenge?.value;$('resetConfirmButton').disabled=!valid});$('resetConfirmButton')?.addEventListener('click',()=>{if(!$('resetConfirmButton').disabled){closeResetDialog();send('reset_everything')}});"
          if 'resetEverythingButton' not in s: replace_once('app/src/main/assets/web-play/app.js',"$('rerunNimmyButton')?.addEventListener",reset_handlers+"$('rerunNimmyButton')?.addEventListener")

          # Android bridge protocol.
          p=root/'app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/WebUiBridgeProtocol.kt'; s=p.read_text()
          s=s.replace('"read_state", "read_changelog", "read_profile", "read_onboarding_state", "complete_nimmy_tutorial", "music_state",','"read_state", "read_changelog", "read_profile", "read_onboarding_state", "complete_nimmy_tutorial", "read_feature_tutorial", "complete_feature_tutorial", "reset_everything", "music_state",',1)
          if '"read_feature_tutorial", "complete_feature_tutorial"' not in s:
              marker='            "submit_guess" -> {'
              feature='''            "read_feature_tutorial", "complete_feature_tutorial" -> {\n                if (request.length() != 4 || !request.has("featureId")) return ParseResult.Invalid("invalid_request", id)\n                val featureId = request.opt("featureId") as? String ?: return ParseResult.Invalid("invalid_feature", id)\n                if (featureId !in setOf("rewards","journey","shop","homebase","relics","codex","settings","prestige","ultra","talent","mutators","stats","arcade","stake","music","changelog","about")) return ParseResult.Invalid("invalid_feature", id)\n                ParseResult.Valid(id, type, itemId = featureId)\n            }\n'''
              s=s.replace(marker,feature+marker,1)
          p.write_text(s)

          # Android host: custom PFP data, global feature tutorial state, reset restart.
          p=root/'app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/ProductionWebPlayScreen.kt'; s=p.read_text()
          old='.put("avatarId", storedProfile?.avatarId ?: "star")\n                                                    .put("setupComplete", storedProfile?.setupComplete == true)'
          new='''.put("avatarId", storedProfile?.avatarId ?: "star")\n                                                    .put("customAvatarData", if (storedProfile?.avatarId == "custom" && !storedProfile.customAvatarPath.isNullOrBlank()) runCatching {\n                                                        val file = java.io.File(storedProfile.customAvatarPath)\n                                                        val mime = when (file.extension.lowercase()) { "png" -> "image/png"; "webp" -> "image/webp"; else -> "image/jpeg" }\n                                                        "data:$mime;base64," + android.util.Base64.encodeToString(file.readBytes(), android.util.Base64.NO_WRAP)\n                                                    }.getOrNull() else null)\n                                                    .put("setupComplete", storedProfile?.setupComplete == true)'''
          replace_once('app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/ProductionWebPlayScreen.kt',old,new)
          p=root/'app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/ProductionWebPlayScreen.kt'; s=p.read_text()
          marker='                                        if (parsed.type == "read_profile") {'
          if 'parsed.type == "read_feature_tutorial"' not in s:
              handler='''                                        if (parsed.type == "read_feature_tutorial" || parsed.type == "complete_feature_tutorial") {\n                                            val featureId = parsed.itemId ?: ""\n                                            val prefs = context.applicationContext.getSharedPreferences("web_play_onboarding", android.content.Context.MODE_PRIVATE)\n                                            if (parsed.type == "complete_feature_tutorial") {\n                                                prefs.edit().putBoolean("nimmy_feature_$featureId", true).apply()\n                                                replyProxy.postMessage(JSONObject().put("version", 1).put("id", parsed.id).put("type", "state").put("state", JSONObject().put("accepted", true)).toString())\n                                            } else {\n                                                replyProxy.postMessage(JSONObject().put("version", 1).put("id", parsed.id).put("type", "feature_tutorial_state").put("featureId", featureId).put("completed", prefs.getBoolean("nimmy_feature_$featureId", false)).toString())\n                                            }\n                                            return@post\n                                        }\n                                        if (parsed.type == "reset_everything") {\n                                            onResetData()\n                                            replyProxy.postMessage(JSONObject().put("version", 1).put("id", parsed.id).put("type", "state").put("state", JSONObject().put("accepted", true)).toString())\n                                            webViewRef?.postDelayed({\n                                                val intent = context.packageManager.getLaunchIntentForPackage(context.packageName)?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)\n                                                if (intent != null) context.startActivity(intent)\n                                            }, 1600L)\n                                            return@post\n                                        }\n'''
              s=s.replace(marker,handler+marker,1)
          p.write_text(s)

          # Windows host: extend expected keys, custom PFP, feature state, reset/restart.
          p=root/'desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt'; s=p.read_text()
          s=s.replace('"read_state", "read_changelog", "read_profile", "read_onboarding_state", "complete_nimmy_tutorial", "navigate",','"read_state", "read_changelog", "read_profile", "read_onboarding_state", "complete_nimmy_tutorial", "read_feature_tutorial", "complete_feature_tutorial", "reset_everything", "navigate",',1)
          old='''.put("avatarId", profile?.avatarId ?: "star")\n                                .put("setupComplete", profile?.setupComplete == true).toString())'''
          new='''.put("avatarId", profile?.avatarId ?: "star")\n                                .put("customAvatarData", if (profile?.avatarId == "custom" && !profile.customAvatarPath.isNullOrBlank()) runCatching {\n                                    val file = java.io.File(profile.customAvatarPath)\n                                    val mime = when (file.extension.lowercase()) { "png" -> "image/png"; "webp" -> "image/webp"; else -> "image/jpeg" }\n                                    "data:$mime;base64," + java.util.Base64.getEncoder().encodeToString(file.readBytes())\n                                }.getOrNull() else null)\n                                .put("setupComplete", profile?.setupComplete == true).toString())'''
          replace_once('desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt',old,new)
          p=root/'desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt'; s=p.read_text()
          marker='                        if (type == "read_profile") {'
          if 'type == "read_feature_tutorial"' not in s:
              handler='''                        if (type == "read_feature_tutorial" || type == "complete_feature_tutorial") {\n                            val featureId = request.optString("featureId", "")\n                            val prefs = java.util.prefs.Preferences.userRoot().node("GuessTheNumber/web-play-onboarding")\n                            if (type == "complete_feature_tutorial") {\n                                prefs.putBoolean("nimmy_feature_$featureId", true); prefs.flush()\n                                reply(org.json.JSONObject().put("version", 1).put("id", requestId).put("type", "state").put("state", org.json.JSONObject().put("accepted", true)).toString())\n                            } else {\n                                reply(org.json.JSONObject().put("version", 1).put("id", requestId).put("type", "feature_tutorial_state").put("featureId", featureId).put("completed", prefs.getBoolean("nimmy_feature_$featureId", false)).toString())\n                            }\n                            return@launch\n                        }\n                        if (type == "reset_everything") {\n                            resetAllGameData()\n                            reply(org.json.JSONObject().put("version", 1).put("id", requestId).put("type", "state").put("state", org.json.JSONObject().put("accepted", true)).toString())\n                            delay(1800)\n                            kotlin.system.exitProcess(0)\n                            return@launch\n                        }\n'''
              s=s.replace(marker,handler+marker,1)
