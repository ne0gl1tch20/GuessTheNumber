name: Repair feature updater

on:
  push:
    branches:
      - feature/html-economy-tutorial-reset

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and retry updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-html-feature-update.yml')
          if p.exists():
              s=p.read_text()
              s=s.replace("marker='<button type=\"button\" id=\"rerunNimmyButton\"'", "marker='id=\"rerunNimmyButton\"'")
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-html-feature-update.yml
          git rm -f .github/workflows/repair-feature-updater.yml
          git diff --cached --check
          git commit -m "Repair feature update workflow"
          git push origin HEAD:feature/html-economy-tutorial-reset
