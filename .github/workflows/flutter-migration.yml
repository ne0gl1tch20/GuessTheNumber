name: Flutter Migration

on:
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-migration.yml"
  push:
    branches: [master]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter format, analyze, test and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug
