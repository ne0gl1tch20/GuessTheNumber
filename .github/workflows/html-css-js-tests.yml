name: HTML CSS JS Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-assets-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-assets:
    name: Validate shared HTML, CSS and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax of every tracked JavaScript file
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.js' '*.mjs' '*.cjs')
          if [ ${#files[@]} -eq 0 ]; then echo 'No tracked JavaScript files found.'; exit 1; fi
          for file in "${files[@]}"; do echo "Checking $file"; node --check "$file"; done

      - name: Audit all tracked HTML, CSS and JavaScript files
        run: python tools/audit_web_frontend.py --report-file build/reports/web-frontend-audit.txt

      - name: Validate current WebView bundle structure
        run: python tools/validate_web_assets.py

      - name: Check current WebView CSS structure
        run: python tools/validate_web_assets.py --css-only

      - name: Test Jarrlyy UI SDK and demo assets
        run: python tools/test_jarrlyy_ui_sdk.py

      - name: Smoke-test Jarrlyy UI SDK runtime initialization
        run: node tools/test_jarrlyy_ui_sdk_runtime.cjs

      - name: Test localized randomized guess feedback
        run: python tools/test_guess_feedback_localization.py
