name: HTML CSS JS Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-assets-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-assets:
    name: Validate shared HTML, CSS and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/web-play/app.js

      - name: Validate HTML structure and local asset references
        run: python tools/validate_web_assets.py

      - name: Check CSS syntax balance
        run: python tools/validate_web_assets.py --css-only

      - name: Test localized randomized guess feedback
        run: python tools/test_guess_feedback_localization.py
