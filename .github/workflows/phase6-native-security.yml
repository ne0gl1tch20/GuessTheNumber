name: Phase 6 Native and Security Validation

on:
  pull_request:
    branches: [master]
    paths:
      - "app/src/main/cpp/**"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/repository/GameDataArchive.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/repository/NativeGameDataCrypto.kt"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/store/SecureSaveTransfer.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/store/PortableSaveBackup.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/store/CreativeModeSave.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/data/store/SaveManager.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/ui/screens/SaveSlotsScreen.kt"
      - "app/src/main/java/com/jarrlyyy/guessthenumber/ui/viewmodel/GameViewModel.kt"
      - "app/src/test/java/com/jarrlyyy/guessthenumber/data/store/SecureSaveTransferTest.kt"
      - "app/src/test/java/com/jarrlyyy/guessthenumber/data/store/PortableSaveBackupTest.kt"
      - "app/src/test/java/com/jarrlyyy/guessthenumber/data/store/CreativeModeSaveTest.kt"
      - "app/src/test/java/com/jarrlyyy/guessthenumber/data/store/CreativeModeSaveManagerTest.kt"
      - "shared/src/jvmAndAndroidMain/kotlin/com/jarrlyyy/guessthenumber/shared/engine/NativeGameplayOptimizer.kt"
      - "app/build.gradle.kts"
      - "docs/TRAIT_SYSTEM_ROADMAP.md"
      - ".github/workflows/phase6-native-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-native-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build native library and Android tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run JVM tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-build-cache --console=plain

      - name: Run native AES-GCM instrumentation tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device
            for attempt in $(seq 1 36); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 5
            done
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
              echo "Android emulator did not finish booting within 180 seconds."
              adb devices -l
              exit 1
            fi
            adb shell cmd package list packages >/dev/null
            ./gradlew :app:connectedDebugAndroidTest --no-build-cache --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.jarrlyyy.guessthenumber.data.repository.NativeGameDataCryptoInstrumentedTest
