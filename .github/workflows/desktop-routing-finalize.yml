name: Desktop routing finalize

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop-routing-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix popup-only routing and save loading
        shell: python
        run: |
          from pathlib import Path

          main = Path('desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/Main.kt')
          s = main.read_text()
          s = s.replace('''                                        DesktopDestination.MUTATORS -> DesktopGameSection.MUTATORS\n                                        DesktopDestination.SAVE_SLOTS -> DesktopGameSection.SAVE_SLOTS\n                                        DesktopDestination.RELICS -> DesktopGameSection.RELICS,''', '''                                        DesktopDestination.MUTATORS -> DesktopGameSection.MUTATORS\n                                        DesktopDestination.RELICS -> DesktopGameSection.RELICS,''', 1)
          s = s.replace('''                                        DesktopDestination.LUCKY_STAKE -> DesktopGameSection.LUCKY_STAKE\n                                        DesktopDestination.ARCADE -> DesktopGameSection.ARCADE\n                                        DesktopDestination.MUSIC_PLAYER -> DesktopGameSection.MUSIC_PLAYER,''', '''                                        DesktopDestination.LUCKY_STAKE -> DesktopGameSection.LUCKY_STAKE\n                                        DesktopDestination.MUSIC_PLAYER -> DesktopGameSection.MUSIC_PLAYER,''', 1)
          s = s.replace('''                        DesktopDestination.SAVE_SLOTS,\n                        DesktopDestination.RELICS,\n                        DesktopDestination.DEVELOPER_SETTINGS,''', '''                        DesktopDestination.RELICS,\n                        DesktopDestination.DEVELOPER_SETTINGS,''', 1)
          old = '''                                DesktopDestination.ARCADE,\n                                DesktopDestination.SAVE_SLOTS -> ProductionGuessGameScreen(\n                                    section = if (target == DesktopDestination.ARCADE) {\n                                        DesktopGameSection.ARCADE\n                                    } else {\n                                        DesktopGameSection.SAVE_SLOTS\n                                    },'''
          new = '''                                DesktopDestination.ARCADE,\n                                DesktopDestination.SAVE_SLOTS -> ProductionGuessGameScreen(\n                                    section = if (target == DesktopDestination.ARCADE) {\n                                        DesktopGameSection.ARCADE\n                                    } else {\n                                        DesktopGameSection.SAVE_SLOTS\n                                    },\n                                    onNativeSaveLoaded = { popupDestination = null },'''
          if old not in s:
              raise SystemExit('popup Production screen block not found')
          s = s.replace(old, new, 1)
          main.write_text(s)

          prod = Path('desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt')
          p = prod.read_text()
          p = p.replace('''    onOpenPlayerProfile: () -> Unit = {},\n    onDesktopUpdateRequest:''', '''    onOpenPlayerProfile: () -> Unit = {},\n    onNativeSaveLoaded: () -> Unit = {},\n    onDesktopUpdateRequest:''', 1)
          p = p.replace('''                                        feedback = "Switched to save slot $targetSlot."\n                                    } else feedback =''', '''                                        feedback = "Switched to save slot $targetSlot."\n                                        if (section == DesktopGameSection.SAVE_SLOTS) onNativeSaveLoaded()\n                                    } else feedback =''', 1)
          p = p.replace('''                                feedback = "Created and switched to slot $targetSlot."\n                            } else feedback =''', '''                                feedback = "Created and switched to slot $targetSlot."\n                                if (section == DesktopGameSection.SAVE_SLOTS) onNativeSaveLoaded()\n                            } else feedback =''', 1)
          prod.write_text(p)

          nav_test = Path('desktopApp/src/jvmTest/kotlin/com/jarrlyyy/guessthenumber/desktop/DesktopNavigationTest.kt')
          if nav_test.exists():
              t = nav_test.read_text()
              if 'assertFalse(DesktopDestination.SAVE_SLOTS in DesktopDestination.MAIN_NAVIGATION_ORDER)' not in t:
                  t += '''\n\n@Test\nfun nativePopupDestinationsAreNotShellNavigation() {\n    assertFalse(DesktopDestination.SAVE_SLOTS in DesktopDestination.MAIN_NAVIGATION_ORDER)\n    assertFalse(DesktopDestination.ARCADE in DesktopDestination.MAIN_NAVIGATION_ORDER)\n    assertFalse(DesktopDestination.DEVELOPER_SETTINGS in DesktopDestination.MAIN_NAVIGATION_ORDER)\n}\n'''
                  nav_test.write_text(t)

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/Main.kt desktopApp/src/jvmMain/kotlin/com/jarrlyyy/guessthenumber/desktop/ProductionGuessGameScreen.kt desktopApp/src/jvmTest/kotlin/com/jarrlyyy/guessthenumber/desktop/DesktopNavigationTest.kt
          git diff --cached --quiet || git commit -m 'fix(desktop): close save popup after native slot load'
          git rm .github/workflows/desktop-routing-finalize.yml
          git commit -m 'chore: remove temporary routing finalize workflow'
          git push origin master
