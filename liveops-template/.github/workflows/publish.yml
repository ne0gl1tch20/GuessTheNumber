name: Publish signed Lua LiveOps manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LiveOps content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare signing key
        env:
          LUA_LIVEOPS_PRIVATE_KEY_PEM: ${{ secrets.LUA_LIVEOPS_PRIVATE_KEY_PEM }}
        run: |
          test -n "$LUA_LIVEOPS_PRIVATE_KEY_PEM" || { echo "Missing LUA_LIVEOPS_PRIVATE_KEY_PEM secret"; exit 1; }
          printf '%s' "$LUA_LIVEOPS_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/lua-liveops-private.pem"
          chmod 600 "$RUNNER_TEMP/lua-liveops-private.pem"

      - name: Generate signed manifest
        run: |
          python3 tools/sign_lua_liveops_bundle.py \
            --payload payload.json \
            --scripts-dir scripts \
            --private-key "$RUNNER_TEMP/lua-liveops-private.pem" \
            --output manifest.json

      - name: Commit signed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Signed manifest is unchanged."
            exit 0
          fi
          git commit -m "Publish signed Lua LiveOps bundle"
          git push

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lua-liveops-private.pem"
